services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: athena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: athenadb
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athenadb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  athena-broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athena-broker
    stop_grace_period: 40s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://athena:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/athenadb
      PORT: 8080
      RUST_LOG: info,athena_broker=debug,tower_http=info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/athena-broker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local
